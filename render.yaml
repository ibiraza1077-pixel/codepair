services:
  - type: web
    name: codepair-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        value: https://codepair-nine.vercel.app
      - key: ENABLE_CODE_EXECUTION
        value: "false"
